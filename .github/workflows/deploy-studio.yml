# Deploys the Sanity Studio (and its schema) whenever something in /studio changes on main.
# Needs one GitHub secret: SANITY_AUTH_TOKEN, a Sanity token with "Deploy Studio" rights
# (sanity.io/manage → API → Tokens). You can also run it by hand from the Actions tab.
name: Deploy Sanity Studio

on:
  push:
    branches: [main]
    paths: ['studio/**']
  workflow_dispatch:

# Only one deploy at a time; a newer push replaces one that's still waiting
concurrency:
  group: deploy-studio
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - name: Deploy Studio and schema
        run: npx sanity deploy --yes
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
